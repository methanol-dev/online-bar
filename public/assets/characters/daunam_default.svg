  <path d="M 42 96 Q 20 100 15 80" stroke="#111111" stroke-width="4" stroke-linecap="round" fill="none" />
  <path d="M 78 96 Q 100 100 105 80" stroke="#111111" stroke-width="4" stroke-linecap="round" fill="none" />
  
