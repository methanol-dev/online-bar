  <path d="M 38 48 Q 46 44 54 48" stroke="#111111" stroke-width="2.5" stroke-linecap="round" fill="none" />
  <path d="M 66 48 Q 74 44 82 48" stroke="#111111" stroke-width="2.5" stroke-linecap="round" fill="none" />
  
  <!-- Eyes (Funny Meme Eyes) -->
  <ellipse cx="46" cy="56" rx="5" ry="6" fill="#111111" />
  <ellipse cx="74" cy="56" rx="5" ry="6" fill="#111111" />
  <circle cx="44" cy="54" r="1.5" fill="#ffffff" />
  <circle cx="72" cy="54" r="1.5" fill="#ffffff" />
  
  <!-- Funny Grin Smile -->
  <path d="M 42 70 Q 60 84 78 70" stroke="#111111" stroke-width="3" stroke-linecap="round" fill="#ffffff" />
  <path d="M 46 72 Q 60 80 74 72" stroke="#111111" stroke-width="1.5" fill="none" />
