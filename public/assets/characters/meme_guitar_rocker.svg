<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 180" width="140" height="180">
  <!-- Mushroom Hair -->
  <path d="M 22 55 C 10 10, 130 10, 118 55 C 100 66, 40 66, 22 55 Z" fill="#111111" />
  
  <!-- Face -->
  <ellipse cx="70" cy="66" rx="40" ry="34" fill="#ffffff" stroke="#111111" stroke-width="3.5" />
  
  <!-- Sunglasses -->
  <path d="M 36 54 L 64 54 L 60 70 L 38 70 Z" fill="#111111" />
  <path d="M 76 54 L 104 54 L 102 70 L 80 70 Z" fill="#111111" />
  <line x1="64" y1="58" x2="76" y2="58" stroke="#111111" stroke-width="3.5" />

  <!-- Confident Smirk -->
  <path d="M 52 82 Q 70 94 88 80" stroke="#111111" stroke-width="3" stroke-linecap="round" fill="none" />

  <!-- Body -->
  <path d="M 50 102 L 36 142 L 104 142 L 90 102 Z" fill="#111111" stroke="#111111" stroke-width="3.5" />

  <!-- Electric Red Guitar Slung Across Chest -->
  <g transform="translate(18, 70) rotate(-25)">
    <!-- Guitar Body -->
    <path d="M 30 50 C 15 35, 10 70, 30 85 C 50 95, 65 75, 55 55 Z" fill="#ef4444" stroke="#111111" stroke-width="3" />
    <!-- Guitar Neck -->
    <rect x="40" y="0" width="8" height="55" fill="#eab308" stroke="#111111" stroke-width="2" />
    <polygon points="38,0 50,0 52,-12 36,-12" fill="#111111" />
    <!-- Sound Hole / Pickguard -->
    <ellipse cx="38" cy="68" rx="8" ry="8" fill="#ffffff" stroke="#111111" stroke-width="1.5" />
  </g>

  <!-- Arms Playing Guitar -->
  <path d="M 44 108 Q 30 115 48 125" stroke="#111111" stroke-width="4.5" stroke-linecap="round" fill="none" />
  <path d="M 94 108 Q 80 120 62 118" stroke="#111111" stroke-width="4.5" stroke-linecap="round" fill="none" />

  <!-- Legs Stance -->
  <path d="M 48 142 L 34 174 M 92 142 L 106 174" stroke="#111111" stroke-width="5" stroke-linecap="round" />
</svg>
