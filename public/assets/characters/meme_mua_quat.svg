<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 180" width="140" height="180">
  <!-- Mushroom Hair -->
  <path d="M 22 55 C 10 10, 130 10, 118 55 C 100 66, 40 66, 22 55 Z" fill="#111111" />
  
  <!-- Face -->
  <ellipse cx="70" cy="66" rx="40" ry="34" fill="#ffffff" stroke="#111111" stroke-width="3.5" />

  <!-- Funny Crying/Sweating Dance Eyes -->
  <ellipse cx="52" cy="60" rx="6" ry="8" fill="#111111" />
  <ellipse cx="88" cy="60" rx="6" ry="8" fill="#111111" />
  <circle cx="50" cy="58" r="2" fill="#ffffff" />
  <circle cx="86" cy="58" r="2" fill="#ffffff" />

  <!-- Wide Open Screaming Mouth -->
  <ellipse cx="70" cy="82" rx="16" ry="12" fill="#ef4444" stroke="#111111" stroke-width="3" />
  <ellipse cx="70" cy="88" rx="10" ry="5" fill="#fca5a5" />

  <!-- Body -->
  <path d="M 50 102 L 36 142 L 104 142 L 90 102 Z" fill="#ffffff" stroke="#111111" stroke-width="3.5" />

  <!-- Fan Dance Arms (Múa Quạt) Raised High -->
  <path d="M 44 106 Q 15 70 30 38" stroke="#111111" stroke-width="4.5" stroke-linecap="round" fill="none" />
  <path d="M 96 106 Q 125 70 110 38" stroke="#111111" stroke-width="4.5" stroke-linecap="round" fill="none" />

  <!-- Hands Spinning / Fan Lines -->
  <path d="M 20 36 Q 30 24 40 38" stroke="#00f0ff" stroke-width="2.5" fill="none" />
  <path d="M 100 38 Q 110 24 120 36" stroke="#ff007f" stroke-width="2.5" fill="none" />

  <!-- Legs Jumping -->
  <path d="M 52 142 L 40 170 M 88 142 L 100 170" stroke="#111111" stroke-width="5" stroke-linecap="round" />
</svg>
